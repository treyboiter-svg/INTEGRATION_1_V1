<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mlb-pitch-environment-live-dashboard</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root,[data-theme="light"]{--bg:#f7f6f2;--surface:#f9f8f5;--surface2:#fbfbf9;--offset:#f3f0ec;--border:#d4d1ca;--divider:#dcd9d5;--text:#28251d;--muted:#66645d;--faint:#a29f98;--primary:#01696f;--primaryHover:#0c4e54;--warn:#964219;--err:#a12c7b;--ok:#437a22;--shadow:0 10px 30px rgba(25,22,16,.08);--r1:.5rem;--r2:.8rem;--r3:1rem;--body:'Satoshi','Inter',sans-serif;--display:'General Sans','Inter',sans-serif}
    [data-theme="dark"]{--bg:#171614;--surface:#1c1b19;--surface2:#201f1d;--offset:#22211f;--border:#393836;--divider:#262523;--text:#e2dfd8;--muted:#aea9a1;--faint:#817b72;--primary:#4f98a3;--primaryHover:#6daeb7;--warn:#bb653b;--err:#d163a7;--ok:#6daa45;--shadow:0 10px 30px rgba(0,0,0,.35)}
    *{box-sizing:border-box} body{margin:0;font-family:var(--body);background:var(--bg);color:var(--text)} a{text-decoration:none;color:inherit} button,input{font:inherit}
    .app{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:1rem;position:sticky;top:0;height:100vh;overflow:auto}.main{min-width:0}
    .logo{display:flex;gap:.85rem;align-items:center;margin-bottom:1rem}.logo svg{width:34px;height:34px;color:var(--primary)}.title{font-family:var(--display);font-size:1.2rem;font-weight:700}.muted{color:var(--muted)}.tiny{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
    .search,.select{width:100%;padding:.85rem 1rem;border:1px solid var(--border);border-radius:var(--r2);background:var(--surface2);color:var(--text)}
    .nav{display:grid;gap:.5rem;margin-top:.8rem}.nav a{padding:.85rem 1rem;border:1px solid transparent;border-radius:var(--r2);background:transparent}.nav a:hover,.nav a.active{background:var(--offset);border-color:var(--border)}
    .topbar{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:1rem 1.25rem;border-bottom:1px solid var(--border);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);z-index:2}.topbar h1{margin:.15rem 0 0;font-family:var(--display)}
    .toolbar{display:flex;gap:.6rem;flex-wrap:wrap}.btn{min-height:44px;padding:.75rem 1rem;border-radius:var(--r2);border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#f7f6f2}.btn:hover{transform:translateY(-1px)}
    .content{padding:1.25rem;display:grid;gap:1rem}.page{display:none;gap:1rem}.page.active{display:grid}.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r3);padding:1rem;box-shadow:var(--shadow)}
    .hero{display:grid;grid-template-columns:1.2fr .8fr;gap:1rem}.kpis,.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem}.metric{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:1rem}.metric strong{display:block;font-family:var(--display);font-size:1.5rem;line-height:1;margin:.35rem 0}.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:1rem}
    table{width:100%;border-collapse:collapse} th,td{padding:.7rem .55rem;border-bottom:1px solid var(--divider);text-align:left;vertical-align:top;font-size:.92rem} th{color:var(--muted)}
    .badge,.pill{display:inline-flex;align-items:center;padding:.2rem .55rem;border-radius:999px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}.badge.out{background:rgba(1,105,111,.12);color:var(--primary)}.badge.closed{background:rgba(150,66,25,.14);color:var(--warn)}.badge.warn{background:rgba(161,44,123,.12);color:var(--err)}.pill{background:var(--offset)}
    .game-list{display:grid;gap:.8rem;max-height:530px;overflow:auto}.game-card{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:1rem}.row{display:flex;justify-content:space-between;gap:1rem;align-items:center;flex-wrap:wrap}.findings{display:grid;gap:.75rem}.finding{border:1px solid var(--border);border-left:4px solid var(--warn);background:var(--surface2);border-radius:var(--r2);padding:.9rem 1rem}.finding.fatal{border-left-color:var(--err)}.chart{min-height:320px}
    @media (max-width:1100px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto;border-right:none;border-bottom:1px solid var(--border)}.hero,.grid2{grid-template-columns:1fr}.kpis,.metrics{grid-template-columns:1fr 1fr}}
    @media (max-width:760px){.topbar,.toolbar,.row{display:grid}.kpis,.metrics{grid-template-columns:1fr}.content{padding:1rem}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" aria-label="dashboard logo"><path d="M6 31c7-16 29-18 36-8"/><path d="M8 37c10-9 25-9 32-2" opacity=".5"/><circle cx="35" cy="14" r="6"/></svg>
      <div><div class="title">MLB Pitch Environment</div><div class="muted">Daily live dashboard</div></div>
    </div>
    <div class="tiny">Navigation</div>
    <input id="gameSearch" class="search" placeholder="Search venue or game ID" />
    <div class="nav" id="staticNav">
      <a href="#overview" data-route="overview">Overview</a>
      <a href="#health" data-route="health">System health</a>
    </div>
    <div style="margin-top:1rem" class="tiny">Games</div>
    <div class="nav" id="gameNav"></div>
    <div class="panel" style="margin-top:1rem">
      <div class="tiny">Import newer run</div>
      <p class="muted">Load bundle JSON or current CSV exports from a newer run directory.</p>
      <label class="btn" style="display:block;text-align:center;position:relative;overflow:hidden">Import files<input id="fileLoader" type="file" multiple accept=".json,.csv" style="position:absolute;inset:0;opacity:0;cursor:pointer"></label>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div class="tiny">Single-file local dashboard</div><h1 id="pageTitle">Overview</h1></div>
      <div class="toolbar">
        <button class="btn" id="themeToggle">Theme</button>
        <button class="btn" id="exportBundle">Export bundle JSON</button>
        <button class="btn primary" id="exportHealth">Export health JSON</button>
      </div>
    </header>
    <div class="content">
      <section class="page" id="page-overview"></section>
      <section class="page" id="page-health"></section>
      <section class="page" id="page-game"></section>
    </div>
  </main>
</div>
<script>
let state = {meta:{},summary:{},games:[],game_environment_audit:[],roof_evidence_audit:[],pitcher_query_audit:[],pitch_physics_environment:[],run_health_and_model_diagnostics:[],findings:[],debug:{}};
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const dtf = new Intl.DateTimeFormat('en-US',{dateStyle:'medium',timeStyle:'short'});
const fmt = new Intl.NumberFormat('en-US');
const fmt3 = new Intl.NumberFormat('en-US',{maximumFractionDigits:3,minimumFractionDigits:0});

function parseMaybeJSON(v){ try{return typeof v==='string'&&v?JSON.parse(v):v;}catch{return v;} }
function slugGame(g){ return `game-${g.game_pk}`; }
function exportBlob(name, content, type){ const blob = new Blob([content], {type}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); }
function toCSV(rows){ if(!rows.length) return ''; const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))]; const esc=v=>'"'+String(v??'').replaceAll('"','""')+'"'; return [cols.join(','), ...rows.map(r=>cols.map(c=>esc(r[c])).join(','))].join('\n'); }
function groupBy(rows,key){ return rows.reduce((a,r)=>((a[r[key]]??=[]).push(r),a),{}); }
function normalize(raw){
  const next = {meta:raw.meta||{},summary:raw.summary||{},games:raw.games||[],game_environment_audit:raw.game_environment_audit||[],roof_evidence_audit:raw.roof_evidence_audit||[],pitcher_query_audit:raw.pitcher_query_audit||[],pitch_physics_environment:raw.pitch_physics_environment||[],run_health_and_model_diagnostics:raw.run_health_and_model_diagnostics||[],findings:raw.findings||[],debug:raw.debug||{}};
  next.game_environment_audit = next.game_environment_audit.map(r=>({...r, roof_votes_json: parseMaybeJSON(r.roof_votes_json)}));
  if(!next.games.length && next.game_environment_audit.length){
    const seen = new Map();
    next.game_environment_audit.forEach(r=>{ if(!seen.has(String(r.game_pk))) seen.set(String(r.game_pk), {game_pk:r.game_pk, game_datetime_utc:r.game_datetime_utc, venue_name:r.venue_name||r.venue_name_api, venue_name_api:r.venue_name_api||r.venue_name, roofclass:r.roofclass, roof_state:r.roof_state, roof_decision_reason:r.roof_decision_reason, ballparkelevationm:r.ballparkelevationm}); });
    next.games = [...seen.values()].sort((a,b)=>new Date(a.game_datetime_utc)-new Date(b.game_datetime_utc));
  }
  return next;
}
function summary(){
  const densities = state.game_environment_audit.map(r=>Number(r.air_density_kg_m3)).filter(Number.isFinite);
  return {
    scheduled_games: state.games.length,
    environment_rows: state.game_environment_audit.length,
    roof_evidence_rows: state.roof_evidence_audit.length,
    pitcher_query_rows: state.pitcher_query_audit.length,
    pitch_physics_rows: state.pitch_physics_environment.length,
    findings: state.findings.length,
    unresolved_retractables: state.games.filter(g=>g.roof_state==='UNRESOLVED_RETRACTABLE_ONLY').length,
    density_range: densities.length ? Math.max(...densities)-Math.min(...densities) : 0,
  };
}
function healthExport(){ return {export_type:'system_health', generated_at:new Date().toISOString(), summary:summary(), diagnostics:state.run_health_and_model_diagnostics, findings:state.findings}; }
function hydrateNav(){
  const nav = $('#gameNav'); nav.innerHTML='';
  const q = $('#gameSearch').value.trim().toLowerCase();
  state.games.filter(g=>!q || (`${g.venue_name} ${g.game_pk}`).toLowerCase().includes(q)).forEach(g=>{
    const a=document.createElement('a'); a.href='#'+slugGame(g); a.dataset.route=slugGame(g); a.innerHTML=`<div>${g.venue_name}</div><div class="muted" style="font-size:.8rem">Game ${g.game_pk}</div>`; nav.appendChild(a);
  });
  activateNav();
}
function activateNav(){ const route=(location.hash||'#overview').slice(1); $$('a[data-route]').forEach(a=>a.classList.toggle('active', a.dataset.route===route)); }
function renderOverview(){
  const s=summary();
  const target=$('#page-overview');
  const gameCards = state.games.map(g=>{
    const rows = state.game_environment_audit.filter(r=>String(r.game_pk)===String(g.game_pk));
    const pitchRows = state.pitch_physics_environment.filter(r=>String(r.game_pk)===String(g.game_pk));
    const branches = rows.map(r=>r.branch).join(' / ');
    const cls = g.roof_state==='UNRESOLVED_RETRACTABLE_ONLY' ? 'warn' : (g.roof_state==='CLOSED' ? 'closed' : 'out');
    return `<div class="game-card"><div class="row"><div><div class="tiny">Game ${g.game_pk}</div><h3 style="margin:.25rem 0 .2rem">${g.venue_name}</h3><div class="muted">${g.game_datetime_utc ? dtf.format(new Date(g.game_datetime_utc)) : ''}</div></div><span class="badge ${cls}">${String(g.roof_state||'').replaceAll('_',' ')}</span></div><div class="row" style="margin-top:.75rem"><span class="pill">${branches||'No branches'}</span><span class="pill">Pitch rows: ${pitchRows.length}</span><a class="btn" href="#${slugGame(g)}">Open game page</a></div></div>`;
  }).join('');
  const dataStatus = [
    ['Games', s.scheduled_games],
    ['Environment rows', s.environment_rows],
    ['Pitch physics rows', s.pitch_physics_rows],
    ['Roof evidence rows', s.roof_evidence_rows],
    ['Pitcher query rows', s.pitcher_query_rows],
    ['Findings', s.findings],
  ].map(([k,v])=>`<tr><td>${k}</td><td>${fmt.format(Number(v||0))}</td></tr>`).join('');
  target.innerHTML = `
    <div class="hero">
      <div class="panel"><div class="tiny">Run-ready dashboard</div><h2 style="font-family:var(--display);font-size:2rem;line-height:1.02;margin:.35rem 0 .8rem">Daily-openable local dashboard with game pages, physics rows, exports, and health diagnostics.</h2><p class="muted">This page auto-loads the bundle JSON in the same folder, then falls back to direct CSV/JSON fetches for missing physics or debug layers.</p></div>
      <div class="panel"><div class="tiny">Quick exports</div><div class="toolbar" style="margin-top:.8rem"><button class="btn" onclick="exportBlob('mlb_dashboard_data_bundle.json', JSON.stringify(state,null,2), 'application/json')">Full bundle JSON</button><button class="btn" onclick="exportBlob('mlb_dashboard_system_health.json', JSON.stringify(healthExport(),null,2), 'application/json')">Health JSON</button><button class="btn" onclick="exportBlob('game_environment_audit.csv', toCSV(state.game_environment_audit), 'text/csv')">Environment CSV</button><button class="btn" onclick="exportBlob('pitch_physics_environment.csv', toCSV(state.pitch_physics_environment), 'text/csv')">Physics CSV</button></div></div>
    </div>
    <div class="kpis">
      <div class="metric"><div class="tiny">Games</div><strong>${fmt.format(s.scheduled_games)}</strong><span class="muted">Unique game pages</span></div>
      <div class="metric"><div class="tiny">Environment rows</div><strong>${fmt.format(s.environment_rows)}</strong><span class="muted">Scenario branches</span></div>
      <div class="metric"><div class="tiny">Pitch rows</div><strong>${fmt.format(s.pitch_physics_rows)}</strong><span class="muted">Per-pitch-type environment rows</span></div>
      <div class="metric"><div class="tiny">Density range</div><strong>${fmt3.format(s.density_range)}</strong><span class="muted">kg/m^3 across loaded venues</span></div>
    </div>
    <div class="grid2">
      <div class="panel"><div class="tiny">Data presence</div><h3 style="margin:.3rem 0 .9rem">Loaded layers</h3><table><tbody>${dataStatus}</tbody></table></div>
      <div class="panel"><div class="tiny">Debug snapshot</div><h3 style="margin:.3rem 0 .9rem">Bundle/file visibility</h3><pre style="white-space:pre-wrap;overflow:auto">${JSON.stringify(state.debug||{}, null, 2)}</pre></div>
    </div>
    <div class="panel" style="margin-top:1rem"><div class="row"><div><div class="tiny">Games</div><h3 style="margin:.3rem 0 .2rem">Per-game navigation cards</h3></div></div><div class="game-list" style="margin-top:1rem">${gameCards || '<div class="muted">No games loaded.</div>'}</div></div>`;
}
function renderHealth(){
  const s=summary();
  $('#page-health').innerHTML = `
    <div class="row"><div><div class="tiny">Diagnostics interface</div><h2 style="font-family:var(--display);margin:.2rem 0">System health</h2><p class="muted">Exports this panel directly to a JSON document and exposes findings plus roof-source evidence.</p></div><div class="toolbar"><button class="btn primary" onclick="exportBlob('mlb_dashboard_system_health.json', JSON.stringify(healthExport(),null,2), 'application/json')">Export health JSON</button><button class="btn" onclick="exportBlob('findings.csv', toCSV(state.findings), 'text/csv')">Export findings CSV</button></div></div>
    <div class="metrics"><div class="metric"><div class="tiny">Games</div><strong>${fmt.format(s.scheduled_games)}</strong><span class="muted">Loaded into dashboard</span></div><div class="metric"><div class="tiny">Conditional retractables</div><strong>${fmt.format(s.unresolved_retractables)}</strong><span class="muted">Modeled dual-branch cases</span></div><div class="metric"><div class="tiny">Query rows</div><strong>${fmt.format(s.pitcher_query_rows)}</strong><span class="muted">Pitcher audit queries</span></div><div class="metric"><div class="tiny">Findings</div><strong>${fmt.format(s.findings)}</strong><span class="muted">Current log count</span></div></div>
    <div class="grid2"><div class="panel"><div class="tiny">Checks</div><h3 style="margin:.3rem 0 .9rem">Run diagnostics</h3><table><thead><tr><th>Check</th><th>Value</th><th>Status</th></tr></thead><tbody>${state.run_health_and_model_diagnostics.map(r=>`<tr><td>${r.check}</td><td>${r.value}</td><td>${r.status}</td></tr>`).join('')}</tbody></table></div><div class="panel"><div class="tiny">Findings feed</div><h3 style="margin:.3rem 0 .9rem">Current messages</h3><div class="findings">${state.findings.length ? state.findings.map(f=>`<div class="finding ${String(f.severity||'').toLowerCase()==='fatal'?'fatal':''}"><div class="row"><strong>${f.code}</strong><span class="pill">${f.severity}</span></div><div style="margin-top:.3rem">${f.message||''}</div><div class="muted" style="margin-top:.3rem">Entity: ${f.entity||''} · Action: ${f.action||''}</div></div>`).join('') : '<div class="muted">No findings loaded.</div>'}</div></div></div>
    <div class="panel"><div class="row"><div><div class="tiny">Roof-source evidence</div><h3 style="margin:.3rem 0 .2rem">Parser audit table</h3></div><button class="btn" onclick="exportBlob('roof_evidence_audit.csv', toCSV(state.roof_evidence_audit), 'text/csv')">Export roof evidence CSV</button></div><table style="margin-top:.8rem"><thead><tr><th>Game</th><th>Venue</th><th>Source</th><th>Vote</th><th>Status</th><th>HTTP</th></tr></thead><tbody>${state.roof_evidence_audit.map(r=>`<tr><td>${r.game_pk}</td><td>${r.venue_name}</td><td>${r.source}</td><td>${r.vote||'—'}</td><td>${r.parser_status}</td><td>${r.http_status}</td></tr>`).join('')}</tbody></table></div>`;
}
function renderGame(route){
  const gamePk = route.replace('game-','');
  const g = state.games.find(x=>String(x.game_pk)===String(gamePk));
  const rows = state.game_environment_audit.filter(r=>String(r.game_pk)===String(gamePk));
  const evidence = state.roof_evidence_audit.filter(r=>String(r.game_pk)===String(gamePk));
  const pitchRows = state.pitch_physics_environment.filter(r=>String(r.game_pk)===String(gamePk));
  if(!g){ $('#page-game').innerHTML = '<div class="panel"><h2>Game not found</h2><p class="muted">Choose another game or import a different bundle.</p></div>'; return; }
  const votes = rows[0] ? Object.entries(rows[0].roof_votes_json || {}).map(([k,v])=>`<span class="pill">${k}: ${v||'null'}</span>`).join(' ') : '';
  const pitcherSummary = [...new Map(pitchRows.map(r=>[`${r.pitcher_id}|${r.pitcher_name}|${r.branch}`, r])).values()];
  $('#page-game').innerHTML = `
    <div class="row"><div><div class="tiny">Game page</div><h2 style="font-family:var(--display);margin:.2rem 0">${g.venue_name}</h2><p class="muted">Game ${g.game_pk} · ${g.game_datetime_utc ? dtf.format(new Date(g.game_datetime_utc)) : ''}</p></div><div class="toolbar"><button class="btn" onclick='exportBlob("game_${g.game_pk}.json", JSON.stringify({game:${JSON.stringify(g)}, environment:${JSON.stringify(rows)}, roof_evidence:${JSON.stringify(evidence)}, pitch_physics:${JSON.stringify(pitchRows)}}, null, 2), "application/json")'>Export game JSON</button><button class="btn" onclick='exportBlob("game_${g.game_pk}_pitch_physics.csv", toCSV(${JSON.stringify(pitchRows)}), "text/csv")'>Export physics CSV</button></div></div>
    <div class="metrics"><div class="metric"><div class="tiny">Roof class</div><strong>${g.roofclass||''}</strong><span class="muted">Structural class</span></div><div class="metric"><div class="tiny">Roof state</div><strong>${g.roof_state||''}</strong><span class="muted">${g.roof_decision_reason||''}</span></div><div class="metric"><div class="tiny">Environment rows</div><strong>${rows.length}</strong><span class="muted">Scenario rows</span></div><div class="metric"><div class="tiny">Pitch rows</div><strong>${pitchRows.length}</strong><span class="muted">Pitch-type environment rows</span></div></div>
    <div class="panel"><div class="tiny">Roof votes</div><div style="margin-top:.5rem">${votes || '<span class="muted">No roof votes.</span>'}</div></div>
    <div class="grid2" style="margin-top:1rem"><div class="panel"><div class="tiny">Environment branches</div><h3 style="margin:.3rem 0 .9rem">Branch table</h3><table><thead><tr><th>Branch</th><th>Density</th><th>Temp C</th><th>RH %</th><th>Pressure</th><th>Wind</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.branch}</td><td>${r.air_density_kg_m3}</td><td>${r.temperature_c}</td><td>${r.relative_humidity_pct}</td><td>${r.pressure_hpa}</td><td>${r.external_wind_speed_kmh}</td><td>${r.wind_model_status}</td></tr>`).join('')}</tbody></table></div><div class="panel"><div class="tiny">Pitcher / branch coverage</div><h3 style="margin:.3rem 0 .9rem">Resolved arms</h3><table><thead><tr><th>Pitcher</th><th>ID</th><th>Branch</th><th>Pitch rows</th></tr></thead><tbody>${pitcherSummary.map(r=>`<tr><td>${r.pitcher_name||''}</td><td>${r.pitcher_id||''}</td><td>${r.branch||''}</td><td>${pitchRows.filter(x=>String(x.pitcher_id)===String(r.pitcher_id) && String(x.branch)===String(r.branch)).length}</td></tr>`).join('') || '<tr><td colspan="4">No pitch physics rows loaded.</td></tr>'}</tbody></table></div></div>
    <div class="panel" style="margin-top:1rem"><div class="row"><div><div class="tiny">Pitch physics</div><h3 style="margin:.3rem 0 .2rem">Per-pitch-type environment table</h3></div><button class="btn" onclick='exportBlob("game_${g.game_pk}_roof_evidence.csv", toCSV(${JSON.stringify(evidence)}), "text/csv")'>Export roof evidence CSV</button></div><div style="overflow:auto;margin-top:1rem"><table><thead><tr><th>Pitcher</th><th>Branch</th><th>Pitch type</th><th>Usage %</th><th>Release mph</th><th>Spin rpm</th><th>Active spin idx</th><th>Density ratio</th><th>Delta pfx_x in</th><th>Delta pfx_z in</th><th>Carry wind ft</th><th>Carry density ft</th></tr></thead><tbody>${pitchRows.map(r=>`<tr><td>${r.pitcher_name||''}</td><td>${r.branch||''}</td><td>${r.pitch_type||''}</td><td>${r.usage_pct??''}</td><td>${r.release_speed??''}</td><td>${r.release_spin_rate??''}</td><td>${r.active_spin_environment_index??''}</td><td>${r.density_ratio_to_ref??''}</td><td>${r.delta_pfx_x_inches??''}</td><td>${r.delta_pfx_z_inches??''}</td><td>${r.carry_wind_adjustment_ft_400ft??''}</td><td>${r.carry_density_adjustment_ft_400ft??''}</td></tr>`).join('') || '<tr><td colspan="12">No pitch physics rows loaded.</td></tr>'}</tbody></table></div></div>
    <div class="panel" style="margin-top:1rem"><div class="tiny">Roof-source evidence</div><h3 style="margin:.3rem 0 .9rem">Parser audit table</h3><table><thead><tr><th>Source</th><th>Vote</th><th>Status</th><th>HTTP</th><th>Chars</th></tr></thead><tbody>${evidence.map(r=>`<tr><td><a href="${r.url}" target="_blank" rel="noopener noreferrer">${r.source}</a></td><td>${r.vote||''}</td><td>${r.parser_status||''}</td><td>${r.http_status||''}</td><td>${r.page_char_length||''}</td></tr>`).join('')}</tbody></table></div>`;
}
function route(){
  const route = (location.hash || '#overview').slice(1);
  $('.page.active')?.classList.remove('active');
  if(route==='overview'){ $('#pageTitle').textContent='Overview'; $('#page-overview').classList.add('active'); renderOverview(); }
  else if(route==='health'){ $('#pageTitle').textContent='System health'; $('#page-health').classList.add('active'); renderHealth(); }
  else if(route.startsWith('game-')){ $('#pageTitle').textContent='Game page'; $('#page-game').classList.add('active'); renderGame(route); }
  activateNav();
}
function parseCSV(text){
  const rows=[]; let row=[], val='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], nx=text[i+1];
    if(q){ if(ch==='"' && nx==='"'){ val+='"'; i++; } else if(ch==='"'){ q=false; } else { val+=ch; } }
    else { if(ch==='"'){ q=true; } else if(ch===','){ row.push(val); val=''; } else if(ch==='\n'){ row.push(val); rows.push(row); row=[]; val=''; } else if(ch!=='\r'){ val+=ch; } }
  }
  if(val.length || row.length){ row.push(val); rows.push(row); }
  const [head, ...body] = rows; if(!head) return [];
  return body.filter(r=>r.some(x=>x!=='')).map(r=>Object.fromEntries(head.map((h,i)=>[h, r[i]??''])));
}
async function importFiles(files){
  let next = JSON.parse(JSON.stringify(state));
  for(const file of files){
    const text = await file.text();
    const name = file.name.toLowerCase();
    if(name.endsWith('.json')){
      const js = JSON.parse(text);
      if(js.game_environment_audit) next = normalize(js);
      else if(js.export_type==='system_health'){ next.run_health_and_model_diagnostics = js.diagnostics || next.run_health_and_model_diagnostics; next.findings = js.findings || next.findings; }
    }else if(name.includes('game_environment')) next.game_environment_audit = parseCSV(text);
    else if(name.includes('roof_evidence')) next.roof_evidence_audit = parseCSV(text);
    else if(name.includes('pitcher_query')) next.pitcher_query_audit = parseCSV(text);
    else if(name.includes('pitch_physics')) next.pitch_physics_environment = parseCSV(text);
    else if(name.includes('run_health') || name.includes('diagnostic')) next.run_health_and_model_diagnostics = parseCSV(text);
    else if(name.includes('finding')) next.findings = parseCSV(text);
    else if(name.includes('debug')) { try { next.debug = JSON.parse(text); } catch {} }
  }
  state = normalize(next); hydrateNav(); route();
}
async function boot(){
  try{
    const r = await fetch('./mlb_dashboard_data_bundle.json', {cache:'no-store'});
    if(r.ok){ state = normalize(await r.json()); }
  }catch{}
  if(!state.pitch_physics_environment.length){
    try{
      const r2 = await fetch('./pitch_physics_environment.csv', {cache:'no-store'});
      if(r2.ok){ state.pitch_physics_environment = parseCSV(await r2.text()); }
    }catch{}
  }
  if(!state.debug || !Object.keys(state.debug).length){
    try{
      const r3 = await fetch('./dashboard_debug_snapshot.json', {cache:'no-store'});
      if(r3.ok){ state.debug = await r3.json(); }
    }catch{}
  }
  state = normalize(state);
  hydrateNav(); route();
}
$('#themeToggle').addEventListener('click', ()=>document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
$('#exportBundle').addEventListener('click', ()=>exportBlob('mlb_dashboard_data_bundle.json', JSON.stringify(state,null,2), 'application/json'));
$('#exportHealth').addEventListener('click', ()=>exportBlob('mlb_dashboard_system_health.json', JSON.stringify(healthExport(),null,2), 'application/json'));
$('#gameSearch').addEventListener('input', hydrateNav);
$('#fileLoader').addEventListener('change', e=>importFiles(Array.from(e.target.files)));
window.addEventListener('hashchange', route);
document.documentElement.setAttribute('data-theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
boot();
</script>
